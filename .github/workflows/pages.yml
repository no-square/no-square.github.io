name: Deploy community site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'routes/**'
      - 'tools/build_announcements.py'
      - 'tools/test_build_announcements.py'
      - 'tools/build_esp_releases.py'
      - 'tools/test_build_esp_releases.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 0,12 * * *'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.x'
      - name: Test release builders
        run: python -m unittest discover -s tools -p 'test_build_*.py' -v
      - name: Build announcement feed
        run: python tools/build_announcements.py
      - name: Update ESP release cards
        run: python tools/build_esp_releases.py
      - name: Preserve release updates
        shell: bash
        run: |
          if git diff --quiet -- site/data/announcements.json site/esp.html; then
            echo "Release updates are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/announcements.json site/esp.html
          git commit -m "Update announcement history and ESP releases"
          git push origin HEAD:main
      - name: Prepare site bundle
        shell: bash
        run: |
          mkdir -p site/data/routes
          cp -R routes/. site/data/routes/
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      # Keep the v4 artifact uploader paired with the REST-based Pages deployer.
      # A REST-visible artifact was invisible to the v5 job-scoped list API.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact="github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in {1..15}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${artifact}" --jq '.total_count')
            if [ "$count" -ge 1 ]; then
              echo "Pages artifact is available."
              exit 0
            fi
            echo "Waiting for Pages artifact to become visible ($attempt/15)..."
            sleep 2
          done
          echo "Pages artifact did not become available to the deployment API."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.0
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
